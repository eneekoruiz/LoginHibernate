<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Rides Bilatu</title>
    <h:outputStylesheet library="css" name="ultra.css" />
    
    <style>
        /* Reset básico y fondo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); /* Fondo oscuro elegante */
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Contenedor principal */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .app-title {
            font-size: 2.5rem;
            font-weight: 300;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Layout Flexbox: Izquierda (Búsqueda) - Derecha (Tabla) */
        .content-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: flex-start;
        }

        /* Panel de búsqueda (Izquierda) */
        .search-panel {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Panel de resultados (Derecha) */
        .results-panel {
            flex: 2; /* Ocupa el doble que la búsqueda */
            min-width: 300px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Estilos de Inputs PrimeFaces */
        .field {
            margin-bottom: 1.5rem;
        }

        .field label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Forzar estilos oscuros en inputs de PrimeFaces */
        body .ui-inputfield, 
        body .ui-selectonemenu {
            width: 100% !important;
            background: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            box-shadow: none !important;
        }
        
        body .ui-selectonemenu-panel .ui-selectonemenu-items-wrapper {
             background: #1e293b !important;
        }
        
        body .ui-selectonemenu-item {
            color: #fff !important;
        }

        /* Botones */
        .action-btn {
            width: 100%;
            height: 45px;
            font-weight: bold !important;
        }
        
        .btn-close {
            background: transparent !important;
            border: 1px solid rgba(255,255,255,0.3) !important;
            color: #ccc !important;
            margin-top: 15px;
        }
        
        .btn-close:hover {
            background: rgba(255,255,255,0.1) !important;
            color: white !important;
        }

        /* Tabla */
        body .ui-datatable .ui-datatable-header,
        body .ui-datatable .ui-paginator {
            background: transparent !important;
            border: none !important;
        }
        
        body .ui-datatable thead th {
            background: rgba(16, 185, 129, 0.2) !important;
            color: #fff !important;
            border: none !important;
            text-transform: uppercase;
            font-size: 0.85rem;
            padding: 1rem !important;
        }
        
        body .ui-datatable tbody tr {
            background: transparent !important;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #e2e8f0 !important;
        }
        
        body .ui-datatable tbody tr:hover {
            background: rgba(255,255,255,0.05) !important;
        }
        
        body .ui-datatable .ui-column-title {
            font-weight: bold;
        }

        /* Badge de precio */
        .price-tag {
            background: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Iconos de estado */
        .places-ok { color: #4ade80; font-weight: bold; }
        .places-no { color: #ef4444; font-weight: bold; }
    </style>
</h:head>

<h:body>
    <div class="main-container">
        
        <p:growl id="msgs" showDetail="true" life="3000" />

        <div class="header-section">
            <h1 class="app-title"><i class="pi pi-car" style="font-size: 2.5rem;"></i> Rides Bilatu</h1>
        </div>

        <h:form id="form">
            <div class="content-wrapper">

                <div class="search-panel">
                    
                    <div class="field">
                        <label for="cityCombo"><i class="pi pi-map-marker"></i> Irteera hiri (Origen):</label>
                        <p:selectOneMenu id="cityCombo" value="#{qrBean.selectedCity}" dynamic="true">
                            <f:selectItem itemLabel="Aukeratu..." itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{qrBean.cities}" />
                            <p:ajax listener="#{qrBean.updateArrivalCities}" update="cityCombo2 msgs" />
                        </p:selectOneMenu>
                    </div>

                    <div class="field">
                        <label for="cityCombo2"><i class="pi pi-send"></i> Helmuga hiri (Destino):</label>
                        <p:selectOneMenu id="cityCombo2" value="#{qrBean.selectedCity2}" dynamic="true">
                            <f:selectItem itemLabel="Aukeratu..." itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{qrBean.cities2}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="field">
                        <label for="dateCal"><i class="pi pi-calendar"></i> Data:</label>
                        <p:calendar id="dateCal" 
                                    value="#{qrBean.selectedDate}" 
                                    pattern="dd/MM/yyyy" 
                                    locale="es"
                                    showOn="button"
                                    navigator="true"
                                    mindate="today"> </p:calendar>
                    </div>

                    <div style="margin-top: 30px;">
                        <p:commandButton value="Bilatu (Buscar)" 
                                         action="#{qrBean.findRides}" 
                                         update="ridesTable msgs" 
                                         icon="pi pi-search"
                                         styleClass="action-btn ui-button-success" />
                    </div>
                </div>

                <div class="results-panel">
                    
                    <p:dataTable id="ridesTable" 
                                 value="#{qrBean.availableRides}" 
                                 var="r"
                                 emptyMessage="Ez da bidairik aurkitu irizpide hauekin."
                                 rows="5"
                                 paginator="true"
                                 paginatorPosition="bottom"
                                 paginatorAlwaysVisible="false"
                                 reflow="true" 
                                 rowKey="#{r.rideNumber}"> <f:facet name="header">
                            Emaitzak (Resultados)
                        </f:facet>

                        <p:column headerText="Nontik (Origen)" sortBy="#{r.from}">
                            <h:outputText value="#{r.from}" style="font-weight: 600;"/>
                        </p:column>
                        
                        <p:column headerText="Nora (Destino)" sortBy="#{r.to}">
                            <h:outputText value="#{r.to}" style="font-weight: 600;"/>
                        </p:column>
                        
                        <p:column headerText="Data" sortBy="#{r.date}" style="text-align: center;">
                            <h:outputText value="#{r.date}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="Lekuak" sortBy="#{r.nPlaces}" style="text-align: center; width: 100px;">
                            <h:panelGroup rendered="#{r.nPlaces > 0}">
                                <span class="places-ok"><i class="pi pi-check-circle"></i> #{r.nPlaces}</span>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{r.nPlaces le 0}">
                                <span class="places-no"><i class="pi pi-times-circle"></i> Betea</span>
                            </h:panelGroup>
                        </p:column>

                        <p:column headerText="Prezioa" sortBy="#{r.price}" style="text-align: right; width: 110px;">
                            <span class="price-tag">
                                <h:outputText value="#{r.price}">
                                    <f:convertNumber type="currency" currencySymbol="€" />
                                </h:outputText>
                            </span>
                        </p:column>
                        
                    </p:dataTable>

                    <div style="text-align: right; margin-top: 10px;">
                        <p:commandButton value="Atzera (Cerrar)" 
                                         action="back" 
                                         process="@this"
                                         icon="pi pi-arrow-left"
                                         styleClass="action-btn btn-close" />
                    </div>

                </div>

            </div>
        </h:form>
    </div>
</h:body>
</html>
